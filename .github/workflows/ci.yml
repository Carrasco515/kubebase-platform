name: CI

# Continuous Integration only — this workflow validates the project.
# It does NOT build/push images, and it never deploys to a real cluster.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax (py_compile)
        run: |
          python -m py_compile app/main.py
          echo "OK: app/main.py compiles without syntax errors"

      - name: Check required files exist
        run: |
          missing=0
          for f in Dockerfile app/main.py app/requirements.txt \
                   kubernetes/base/kustomization.yaml; do
            if [ -f "$f" ]; then
              echo "OK: $f is present"
            else
              echo "MISSING: $f is required but was not found" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Check Kubernetes manifests are present (YAML)
        run: |
          count=$(find kubernetes -type f \( -name '*.yaml' -o -name '*.yml' \) | wc -l)
          echo "Found $count Kubernetes YAML file(s)."
          test "$count" -gt 0

      - name: Build manifests with kustomize (base + overlays)
        run: |
          # Pick whichever kustomize is available (kubectl ships one built-in).
          if command -v kubectl >/dev/null 2>&1; then
            build() { kubectl kustomize "$1"; }
          elif command -v kustomize >/dev/null 2>&1; then
            build() { kustomize build "$1"; }
          else
            echo "Neither kubectl nor kustomize available — skipping (allowed)."
            exit 0
          fi
          for dir in kubernetes/base \
                     kubernetes/overlays/dev \
                     kubernetes/overlays/prod; do
            build "$dir" >/dev/null
            echo "OK: kustomize built $dir successfully"
          done

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Validate Helm chart (lint + render default/dev/prod)
        run: |
          helm lint charts/kubebase-api
          helm template kubebase-api charts/kubebase-api >/dev/null
          echo "OK: helm template rendered (default values)"
          helm template kubebase-api charts/kubebase-api \
            -f charts/kubebase-api/values-dev.yaml >/dev/null
          echo "OK: helm template rendered (dev profile)"
          helm template kubebase-api charts/kubebase-api \
            -f charts/kubebase-api/values-prod.yaml >/dev/null
          echo "OK: helm template rendered (prod profile)"

      - name: Validate GitOps Argo CD manifests (presence + structure)
        run: |
          # We cannot fully validate kind: Application without the Argo CD CRDs,
          # so this is a safe presence + structure + YAML-parse check. It never
          # contacts a cluster and never deploys anything.
          rc=0
          for f in gitops/argocd/kubebase-api-dev.yaml \
                   gitops/argocd/kubebase-api-prod.yaml; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f" >&2; rc=1; continue
            fi
            for key in 'kind: Application' 'argoproj.io' 'repoURL' \
                       'targetRevision: main' 'namespace:'; do
              if ! grep -q "$key" "$f"; then
                echo "STRUCTURE: '$key' not found in $f" >&2; rc=1
              fi
            done
            # Best-effort YAML parse (PyYAML if present) — informational only.
            if python -c 'import yaml' 2>/dev/null; then
              python -c "import yaml,sys; list(yaml.safe_load_all(open('$f')))" \
                && echo "OK: $f (valid YAML, structure checks passed)"
            else
              echo "OK: $f (structure checks passed; PyYAML not installed — parse skipped)"
            fi
          done
          exit "$rc"
