<text x="446" y="23" text-anchor="middle" fill="#8b949e">curl — /metrics (Prometheus format)</text>
<text x="18" y="66" xml:space="preserve"><tspan fill="#3fb950">$ </tspan><tspan fill="#58a6ff" font-weight="bold">curl -s http://localhost:8000/metrics | grep -E &quot;^(app_info|http_requests_total|health_check_total)&quot;</tspan></text>
<text x="18" y="87" xml:space="preserve" fill="#c9d1d9">app_info{app_name=&quot;KubeBase Platform&quot;,environment=&quot;local&quot;} 1.0</text>
<text x="18" y="108" xml:space="preserve" fill="#c9d1d9">http_requests_total{method=&quot;GET&quot;,path=&quot;/health&quot;,status=&quot;200&quot;} 1.0</text>
<text x="18" y="129" xml:space="preserve" fill="#c9d1d9">http_requests_total{method=&quot;GET&quot;,path=&quot;/&quot;,status=&quot;200&quot;} 1.0</text>
<text x="18" y="150" xml:space="preserve" fill="#c9d1d9">health_check_total 1.0</text>
