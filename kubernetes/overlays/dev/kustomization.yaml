apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dev overlay — for local development on Minikube.
# It reuses the base unchanged and only tweaks config + replicas.
# Render:  kubectl kustomize kubernetes/overlays/dev
# Apply:   kubectl apply -k kubernetes/overlays/dev

# The base already creates and targets the kubebase-dev namespace, so dev does
# not need its own Namespace object — it simply inherits it.
namespace: kubebase-dev

resources:
  - ../../base

# Small, targeted strategic-merge patches (no need to copy whole base files).
patches:
  - path: configmap-patch.yaml
  - path: deployment-patch.yaml
