apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubebase-api
  namespace: kubebase-dev
  labels:
    app.kubernetes.io/name: kubebase-platform
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kubebase-platform
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubebase-platform
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          # Local image tag. Build it (see docs/operations.md) and load it into
          # your local cluster, e.g. `minikube image load` or `kind load`.
          image: kubebase-platform:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          # Inject the non-secret configuration from the ConfigMap as env vars.
          envFrom:
            - configMapRef:
                name: kubebase-config
          # Readiness: don't send traffic until the app answers /health.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Liveness: restart the container if it stops answering /health.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          # Modest requests/limits — sensible for a small demo app.
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
