# EXAMPLE ONLY — do NOT use these values, and do NOT commit a real Secret.
#
# This file shows the shape of a Kubernetes Secret the app could consume. The
# values below are obvious placeholders. To use a real secret:
#
#   1. Copy this file to secret.yaml (which is git-ignored).
#   2. Replace the placeholder values with your own.
#   3. Apply it yourself, or add it to kustomization.yaml locally.
#
# The demo app does NOT require a secret to run — this is here to demonstrate
# the pattern (ConfigMap for non-secret config, Secret for sensitive values).
#
# stringData lets you write plain text; Kubernetes base64-encodes it on apply.
apiVersion: v1
kind: Secret
metadata:
  name: kubebase-secret
  namespace: kubebase-dev
  labels:
    app.kubernetes.io/name: kubebase-platform
    app.kubernetes.io/component: api
type: Opaque
stringData:
  # Placeholder only — replace in your local, untracked secret.yaml.
  API_TOKEN: "CHANGE_ME_example_token_do_not_use"
  DB_PASSWORD: "CHANGE_ME_example_password_do_not_use"
