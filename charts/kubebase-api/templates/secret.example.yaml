{{- if .Values.secret.enabled }}
# EXAMPLE ONLY — rendered only when secret.enabled=true.
# This demonstrates the Secret pattern. Use PLACEHOLDER values only and never
# commit real secrets. The demo app does not require a Secret to run.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubebase-api.fullname" . }}-secret
  labels:
    {{- include "kubebase-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secret.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
