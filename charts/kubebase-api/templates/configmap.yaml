apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubebase-api.fullname" . }}-config
  labels:
    {{- include "kubebase-api.labels" . | nindent 4 }}
# Non-secret configuration injected into the app as environment variables.
data:
  APP_NAME: {{ .Values.config.appName | quote }}
  APP_ENV: {{ .Values.config.appEnv | quote }}
  APP_GREETING: {{ .Values.config.greeting | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
